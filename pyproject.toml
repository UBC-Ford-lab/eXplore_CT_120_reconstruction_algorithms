[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eXplore_CT_120_reconstruction_algorithms"
dynamic = ["version"]
description = "Cone-beam CT reconstruction for the GE eXplore CT 120 micro-CT scanner: FDK, ASTRA/TIGRE iterative, and learning-based (differentiable projector) backends with shared calibration and HU pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Falk Wiegmann"},
]
keywords = ["CT", "cone-beam", "micro-CT", "reconstruction", "FDK", "SIRT", "differentiable-rendering", "medical-imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "torch>=2.0",
    "xmltodict",
    "imageio",
    "pillow",
    "matplotlib",
    "tqdm",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
# ASTRA iterative backend (CUDA). TIGRE is not on PyPI; see the README.
astra = ["astra-toolbox"]
wandb = ["wandb>=0.16"]
gui = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "paramiko>=3.4", "tomli>=2.0; python_version < '3.11'"]
dev = ["pytest>=8.0", "build", "twine"]

[project.urls]
Repository = "https://github.com/UBC-Ford-lab/eXplore_CT_120_reconstruction_algorithms"
Issues = "https://github.com/UBC-Ford-lab/eXplore_CT_120_reconstruction_algorithms/issues"

[project.scripts]
ct120-fdk = "explore_ct120_recon.run_fdk_recon:cli"
ct120-iterative = "explore_ct120_recon.run_iterative_recon:cli"
ct120-learned = "explore_ct120_recon.run_learned_recon:cli"
ct120-volume-report = "explore_ct120_recon.run_volume_report:cli"
ct120-bilateral-filter = "explore_ct120_recon.run_bilateral_filter:cli"
ct120-projection-report = "explore_ct120_recon.run_projection_report:cli"
ct120-geometry-calibration = "explore_ct120_recon.run_geometry_calibration:cli"
ct120-noise-calibration = "explore_ct120_recon.run_noise_calibration:cli"
ct120-simulate-scan = "explore_ct120_recon.run_simulate_scan:cli"
# --algorithm gaussian_dynamic: the finished run's motion, its 4-D file, its ventilation map, the phantom
ct120-motion-show = "explore_ct120_recon.learning_based_iterative.dynamic_gaussian.show:main"
ct120-export-4d = "explore_ct120_recon.learning_based_iterative.dynamic_gaussian.export4d:main"
ct120-ventilation = "explore_ct120_recon.learning_based_iterative.dynamic_gaussian.ventilation:main"
ct120-breathing-phantom = "explore_ct120_recon.learning_based_iterative.dynamic_gaussian.phantom:main"
# the web page (pip install ".[gui]")
ct120-gui = "explore_ct120_recon.gui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "explore_ct120_recon.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"explore_ct120_recon.gui" = ["static/*", "static/assets/*", "templates/*", "icons/*"]
"explore_ct120_recon" = ["calibration/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that load real scan data (deselected by default)",
]
addopts = "-m 'not slow'"
